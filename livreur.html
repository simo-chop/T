<!DOCTYPE html>
<html lang="ar" dir="rtl" id="courierHtmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simo Chop - Livreur Portal</title>
    <script>
        if (localStorage.getItem('COURIER_LOGGED_IN') !== 'true') {
            window.location.href = 'login-livreur.html';
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #090d16; color: #f1f5f9; }
        .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .transition-smooth { transition: all 0.25s ease-in-out; }
    </style>
</head>
<body class="min-h-screen pb-16">

    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 shadow-lg">
        <div class="max-w-xl mx-auto px-4 py-3 flex justify-between items-center gap-3">
            
            <div class="flex items-center gap-1 bg-slate-800/80 border border-slate-700/80 rounded-xl p-0.5 shadow-inner">
                <button onclick="changeCourierLanguage('ar')" id="c-lang-ar" class="px-2 py-0.5 text-[10px] font-bold rounded-lg transition-smooth">AR</button>
                <button onclick="changeCourierLanguage('fr')" id="c-lang-fr" class="px-2.5 py-0.5 text-[10px] font-bold rounded-lg transition-smooth">FR</button>
                <button onclick="changeCourierLanguage('en')" id="c-lang-en" class="px-2.5 py-0.5 text-[10px] font-bold rounded-lg transition-smooth">EN</button>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="logoutCourier()" class="bg-rose-500/20 hover:bg-rose-500/30 text-rose-400 text-xs font-bold px-2.5 py-1.5 rounded-xl border border-rose-900/50 transition-smooth" title="تسجيل الخروج">
                    <i class="fa-solid fa-power-off"></i>
                </button>
                <div class="text-left">
                    <h1 class="text-sm font-black text-white tracking-wide" id="courierTitleName">صفحة اللفرور</h1>
                    <p class="text-[10px] text-emerald-400 font-bold flex items-center justify-start gap-1.5 mt-0.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> <span data-i18n="connected">متصل بالسيرفر لحظياً</span>
                    </p>
                </div>
                <div class="bg-emerald-500/20 text-emerald-400 w-10 h-10 rounded-2xl flex items-center justify-center text-lg shadow-inner flex-shrink-0">
                    🛵
                </div>
            </div>
        </div>

        <div class="max-w-xl mx-auto px-4 pb-3 flex justify-between items-center gap-3 border-t border-slate-800/60 pt-2.5">
            <span class="bg-amber-400 text-slate-950 font-black text-xs px-3 py-1.5 rounded-xl shadow-sm whitespace-nowrap" id="pendingBadge">0 <span data-i18n="pendingBadgeText">قيد الانتظار</span></span>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-4 mt-6">
        <div id="courierOrdersList" class="space-y-4"></div>
    </main>

    <script>
        function logoutCourier() {
            localStorage.removeItem('COURIER_LOGGED_IN');
            localStorage.removeItem('COURIER_USERNAME');
            window.location.href = 'login-livreur.html';
        }

        const courierTranslations = {
            ar: {
                titlePrefix: "اللفرور",
                connected: "متصل بالسيرفر لحظياً",
                pendingBadgeText: "قيد الانتظار",
                noOrders: "لا توجد طلبات قيد الانتظار حالياً",
                whatsappBtn: "واتساب المستلم",
                deliveredBtn: "✅ تم الإستلام",
                refusedBtn: "❌ رفض",
                scheduleBtn: "📅 جدولة",
                refusalPlaceholder: "سبب الرفض أو اختر من الأسباب أعلاه...",
                confirmRefusal: "تأكيد الرفض",
                confirmSchedule: "تأكيد الجدولة",
                cancelBtn: "إلغاء",
                alertReason: "أدخل السبب",
                currency: "د.م",
                quantityText: "العدد",
                reasons: [
                    "الهاتف مغلق 📴",
                    "الزبون رفض الطلب ❌",
                    "العنوان غير واضح 📍",
                    "غير متواجد حالياً ⏳"
                ]
            },
            fr: {
                titlePrefix: "Livreur",
                connected: "Connecté en temps réel",
                pendingBadgeText: "En attente",
                noOrders: "Aucune commande en attente",
                whatsappBtn: "WhatsApp Client",
                deliveredBtn: "✅ Livré",
                refusedBtn: "❌ Refusé",
                scheduleBtn: "📅 Planifié",
                refusalPlaceholder: "Motif du refus ou choisissez ci-dessus...",
                confirmRefusal: "Confirmer le refus",
                confirmSchedule: "Confirmer la date",
                cancelBtn: "Annuler",
                alertReason: "Veuillez entrer le motif",
                currency: "DH",
                quantityText: "Qté",
                reasons: [
                    "Téléphone éteint 📴",
                    "Client a refusé ❌",
                    "Adresse floue 📍",
                    "Absent pour le moment ⏳"
                ]
            },
            en: {
                titlePrefix: "Courier",
                connected: "Connected in real-time",
                pendingBadgeText: "Pending",
                noOrders: "No pending orders currently",
                whatsappBtn: "Client WhatsApp",
                deliveredBtn: "✅ Delivered",
                refusedBtn: "❌ Refused",
                scheduleBtn: "📅 Schedule",
                refusalPlaceholder: "Refusal reason or select above...",
                confirmRefusal: "Confirm Refusal",
                confirmSchedule: "Confirm Schedule",
                cancelBtn: "Cancel",
                alertReason: "Please enter a reason",
                currency: "DH",
                quantityText: "Qty",
                reasons: [
                    "Phone off 📴",
                    "Customer refused ❌",
                    "Unclear address 📍",
                    "Not available ⏳"
                ]
            }
        };

        let currentCourierLang = localStorage.getItem('COURIER_LANG') || 'ar';

        function changeCourierLanguage(lang) {
            currentCourierLang = lang;
            localStorage.setItem('COURIER_LANG', lang);

            const root = document.getElementById('courierHtmlRoot');
            root.setAttribute('lang', lang);
            root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');

            ['ar', 'fr', 'en'].forEach(l => {
                const btn = document.getElementById(`c-lang-${l}`);
                if (btn) {
                    if (l === lang) {
                        btn.className = "px-2 py-0.5 text-[10px] font-bold rounded-lg transition-smooth bg-indigo-600 text-white shadow-xs";
                    } else {
                        btn.className = "px-2.5 py-0.5 text-[10px] font-bold rounded-lg transition-smooth text-slate-400 hover:text-white";
                    }
                }
            });

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (courierTranslations[lang][key]) {
                    el.textContent = courierTranslations[lang][key];
                }
            });

            updateCourierHeaderName();
            renderCourierOrders();
        }

        const SUPABASE_URL = "https://odrqwpcwcdfftjxatkyx.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kcnF3cGN3Y2RmZnRqeGF0a3l4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNjA2MzAsImV4cCI6MjEwNzkzNjYzMH0.Fvjz335UThZ0OfnwpdKCoO2Zg_WQA8jinFJnGV4CrB0";

        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let orders = [];
        let activeActionId = null;

        updateCourierHeaderName();

        async function loadDataFromSupabase() {
            try {
                const { data } = await sb.from('app_state').select('payload').eq('id', 'simo_store_data').single();
                if (data && data.payload) {
                    orders = data.payload.orders || [];
                    if (!activeActionId) renderCourierOrders();
                }
            } catch (e) {}
        }

        async function saveAllToSupabase() {
            const { data } = await sb.from('app_state').select('payload').eq('id', 'simo_store_data').single();
            let colors = data && data.payload ? data.payload.colors : [];
            let courierDebt = data && data.payload ? (data.payload.courierDebt || 0) : 0;

            const payload = { orders, colors, courierDebt };
            await sb.from('app_state').upsert({ id: 'simo_store_data', payload });
        }

        sb.channel('public:app_state_courier_v9')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'app_state', filter: 'id=eq.simo_store_data' }, payload => {
              if (payload.new && payload.new.payload) {
                  orders = payload.new.payload.orders || [];
                  if (!activeActionId) renderCourierOrders();
              }
          })
          .subscribe();

        loadDataFromSupabase();
        setInterval(loadDataFromSupabase, 1500);
        changeCourierLanguage(currentCourierLang);

        function updateCourierHeaderName() {
            const username = localStorage.getItem('COURIER_USERNAME') || 'اللفرور';
            const prefix = courierTranslations[currentCourierLang].titlePrefix;
            document.getElementById('courierTitleName').textContent = `${prefix}: ${username}`;
        }

        async function markDelivered(id) {
            const idx = orders.findIndex(o => o.id === id);
            if (idx === -1) return;

            const courierUsername = localStorage.getItem('COURIER_USERNAME') || 'اللفرور';
            const order = orders[idx];
            order.status = 'delivered';
            order.deliveredAt = Date.now();
            order.courierName = courierUsername; // تسجيل اسم اللفرور
            const orderQty = order.quantity || 1;

            try {
                const { data } = await sb.from('app_state').select('payload').eq('id', 'simo_store_data').single();
                if (data && data.payload) {
                    let colors = data.payload.colors || [];
                    let prod = colors.find(c => c.id === order.productId);
                    if (prod) {
                        prod.stock = Math.max(0, prod.stock - orderQty);
                    }
                    let courierDebt = data.payload.courierDebt || 0;
                    await sb.from('app_state').upsert({ id: 'simo_store_data', payload: { orders, colors, courierDebt } });
                }
            } catch(e) {}

            activeActionId = null;
            renderCourierOrders();

            const sellerWhatsAppNumber = '212660005716';
            const waMsg = `✅ تم استلام الطلب بنجاح بواسطة (${courierUsername}) \n📦 المنتج: ${order.productName} (العدد: ${orderQty}) \n📍 العنوان: ${order.address} \n💰 الثمن: ${order.price} د.م`;
            window.open(`https://wa.me/${sellerWhatsAppNumber}?text=${encodeURIComponent(waMsg)}`, '_blank');
        }

        function getClientWhatsAppUrl(phone, productName, quantity, price, address) {
            let clean = phone.replace(/[^0-9+]/g, '');
            if (clean.startsWith('06') || clean.startsWith('07')) {
                clean = '212' + clean.substring(1);
            } else if (clean.startsWith('+')) {
                clean = clean.substring(1);
            }
            const username = localStorage.getItem('COURIER_USERNAME') || 'اللفرور';
            const qtyStr = quantity ? ` (العدد: ${quantity})` : '';
            const msg = `👋 السلام عليكم 👋\n\n🛵 معكم : *${username}* اللفرور\n📦 كنتواصل معكم بخصوص الطلب ديالكم: *${productName}* ${qtyStr}\n💵 المبلغ المستحق : *${price}* درهم\n📌 المرجو تأكيد عنوانكم : *${address}*`;
            return `https://wa.me/${clean}?text=${encodeURIComponent(msg)}`;
        }

        function showRefusalBox(id) {
            activeActionId = id;
            document.getElementById('refusal-box-' + id).classList.remove('hidden');
        }

        function showScheduleBox(id) {
            activeActionId = id;
            document.getElementById('schedule-box-' + id).classList.remove('hidden');
        }

        function cancelActionBox(id) {
            activeActionId = null;
            document.getElementById('refusal-box-' + id).classList.add('hidden');
            document.getElementById('schedule-box-' + id).classList.add('hidden');
        }

        function setReasonText(id, text) {
            document.getElementById('reason-input-' + id).value = text;
        }

        async function confirmRefusal(id) {
            const reason = document.getElementById('reason-input-' + id).value.trim();
            if(!reason) return alert(courierTranslations[currentCourierLang].alertReason);
            
            const courierUsername = localStorage.getItem('COURIER_USERNAME') || 'اللفرور';
            const idx = orders.findIndex(o => o.id === id);
            orders[idx].status = 'refused';
            orders[idx].refusalReason = reason;
            orders[idx].courierName = courierUsername; // تسجيل اسم اللفرور
            
            activeActionId = null;
            await saveAllToSupabase();
            renderCourierOrders();
        }

        async function confirmSchedule(id) {
            const d = document.getElementById('sched-date-' + id).value;
            const t = document.getElementById('sched-time-' + id).value;
            
            const courierUsername = localStorage.getItem('COURIER_USERNAME') || 'اللفرور';
            const idx = orders.findIndex(o => o.id === id);
            orders[idx].status = 'scheduled';
            orders[idx].scheduledDate = d;
            orders[idx].scheduledTime = t;
            orders[idx].courierName = courierUsername; // تسجيل اسم اللفرور

            activeActionId = null;
            await saveAllToSupabase();
            renderCourierOrders();
        }

        function renderCourierOrders() {
            const pendingOrders = orders.filter(o => o.status === 'pending');
            document.getElementById('pendingBadge').textContent = `${pendingOrders.length} ${courierTranslations[currentCourierLang].pendingBadgeText}`;
            const container = document.getElementById('courierOrdersList');
            const langData = courierTranslations[currentCourierLang];

            if (pendingOrders.length === 0) {
                container.innerHTML = `<div class="glass-card p-12 text-center rounded-3xl text-slate-400 text-xs">${langData.noOrders}</div>`;
                return;
            }

            container.innerHTML = pendingOrders.map(order => {
                const qtyVal = order.quantity || 1;
                return `
                <div class="glass-card rounded-3xl p-5 shadow-xl text-white">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex items-center gap-1.5 flex-wrap">
                            <span class="text-xs bg-amber-500/20 text-amber-300 font-bold px-3 py-1 rounded-xl">📦 ${order.productName}</span>
                            <span class="text-xs bg-indigo-500/20 text-indigo-300 font-bold px-2.5 py-1 rounded-xl">${langData.quantityText}: ${qtyVal}</span>
                        </div>
                        <span class="font-black text-emerald-400 text-sm bg-emerald-500/10 px-3 py-1 rounded-xl">${order.price} ${langData.currency}</span>
                    </div>
                    <p class="text-sm mb-4 font-bold text-slate-200">📍 ${order.address}</p>
                    <div class="grid grid-cols-2 gap-2.5 mb-3">
                        <a href="tel:${order.phone}" class="bg-blue-600 hover:bg-blue-700 text-center py-3 rounded-2xl font-extrabold text-xs transition-smooth shadow-sm flex items-center justify-center gap-1.5">📞 ${order.phone}</a>
                        <a href="${getClientWhatsAppUrl(order.phone, order.productName, qtyVal, order.price, order.address)}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-center py-3 rounded-2xl font-extrabold text-xs flex items-center justify-center gap-1.5 transition-smooth shadow-sm">
                            <i class="fa-brands fa-whatsapp text-sm"></i> ${langData.whatsappBtn}
                        </a>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="markDelivered('${order.id}')" class="bg-emerald-600 hover:bg-emerald-700 py-3 rounded-2xl font-extrabold text-xs transition-smooth shadow-sm">${langData.deliveredBtn}</button>
                        <button onclick="showRefusalBox('${order.id}')" class="bg-rose-600 hover:bg-rose-700 py-3 rounded-2xl font-extrabold text-xs transition-smooth shadow-sm">${langData.refusedBtn}</button>
                        <button onclick="showScheduleBox('${order.id}')" class="bg-sky-600 hover:bg-sky-700 py-3 rounded-2xl font-extrabold text-xs transition-smooth shadow-sm">${langData.scheduleBtn}</button>
                    </div>
                    
                    <div id="refusal-box-${order.id}" class="hidden mt-4 pt-3 border-t border-slate-800">
                        <div class="flex flex-wrap gap-1.5 mb-2.5">
                            ${langData.reasons.map(r => `
                                <button onclick="setReasonText('${order.id}', '${r}')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-[11px] font-semibold px-2.5 py-1.5 rounded-xl border border-slate-700 transition-smooth">
                                    ${r}
                                </button>
                            `).join('')}
                        </div>
                        <input type="text" id="reason-input-${order.id}" placeholder="${langData.refusalPlaceholder}" class="w-full px-3.5 py-3 bg-slate-900 border border-slate-700 rounded-2xl text-xs mb-2.5 text-white">
                        <div class="flex gap-2">
                            <button onclick="confirmRefusal('${order.id}')" class="flex-1 bg-rose-600 hover:bg-rose-700 py-2.5 rounded-2xl text-xs font-bold transition-smooth">${langData.confirmRefusal}</button>
                            <button onclick="cancelActionBox('${order.id}')" class="px-4 bg-slate-800 hover:bg-slate-700 rounded-2xl text-xs transition-smooth">${langData.cancelBtn}</button>
                        </div>
                    </div>

                    <div id="schedule-box-${order.id}" class="hidden mt-3 pt-3 border-t border-slate-800 text-xs">
                        <div class="grid grid-cols-2 gap-2 mb-2.5">
                            <input type="date" id="sched-date-${order.id}" class="bg-slate-900 p-3 rounded-2xl border border-slate-700 text-white">
                            <input type="time" id="sched-time-${order.id}" class="bg-slate-900 p-3 rounded-2xl border border-slate-700 text-white">
                        </div>
                        <div class="flex gap-2">
                            <button onclick="confirmSchedule('${order.id}')" class="flex-1 bg-sky-600 hover:bg-sky-700 py-2.5 rounded-2xl font-bold transition-smooth">${langData.confirmSchedule}</button>
                            <button onclick="cancelActionBox('${order.id}')" class="px-4 bg-slate-800 hover:bg-slate-700 rounded-2xl transition-smooth">${langData.cancelBtn}</button>
                        </div>
                    </div>
                </div>
            `;
            }).join('');
        }
    </script>
</body>
</html>
