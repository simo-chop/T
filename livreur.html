<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة اللفرور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-lg mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="changeCourierNamePrompt()" class="bg-emerald-500/20 text-emerald-400 p-2.5 rounded-xl text-xl hover:bg-emerald-500/30 active-scale transition" title="اضغط لتغيير اسم اللفرور">
                    🛵
                </button>
                <div>
                    <h1 class="text-lg font-extrabold text-white" id="courierTitleName">صفحة اللفرور</h1>
                    <p class="text-xs text-emerald-400">🟢 متصل بالبائع مباشرة</p>
                </div>
            </div>
            <span class="bg-amber-500 text-slate-950 font-extrabold text-sm px-3 py-1 rounded-full" id="pendingBadge">0 قيد الانتظار</span>
        </div>
    </header>

    <main class="max-w-lg mx-auto px-4 mt-6">
        <div id="courierOrdersList" class="space-y-4"></div>
    </main>

    <script>
        const UPDATED_COLORS = [
            { id: 'black', name: 'مظلة باللون الأسود', stock: 117, cost: 0, price: 130, hex: '#1e293b' },
            { id: 'black_2', name: 'منيطة باللون الأسود', stock: 120, cost: 0, price: 120, hex: '#334155' },
            { id: 'white_2', name: 'منيطة باللون الأبيض', stock: 50, cost: 0, price: 120, hex: '#f8fafc', border: true },
            { id: 'blue', name: 'مظلة باللون الأزرق', stock: 97, cost: 0, price: 130, hex: '#2563eb' },
            { id: 'gray', name: 'مظلة باللون الرمادي', stock: 78, cost: 0, price: 130, hex: '#64748b' },
            { id: 'white', name: 'مظلة باللون الرمادي', stock: 71, cost: 0, price: 130, hex: '#94a3b8' },
            { id: 'pink', name: 'مظلة باللون الوردي', stock: 65, cost: 0, price: 130, hex: '#ec4899' },
            { id: 'green', name: 'مظلة باللون الزيتي', stock: 53, cost: 0, price: 130, hex: '#16a34a' }
        ];

        const urlParams = new URLSearchParams(window.location.search);
        const STORE_ROOM = urlParams.get('store') || localStorage.getItem('DELIVERY_ROOM_CODE') || 'simo_tanger_live_99';
        localStorage.setItem('DELIVERY_ROOM_CODE', STORE_ROOM);

        const ORDERS_KEY = `ORDERS_DATA_${STORE_ROOM}`;
        const COLORS_KEY = `COLORS_DATA_${STORE_ROOM}_v18`;
        const COURIER_NAME_KEY = `COURIER_NAME_${STORE_ROOM}`;
        const NTFY_TOPIC = `simo_delivery_sync_${STORE_ROOM}`;

        let orders = JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]');
        let colors = JSON.parse(localStorage.getItem(COLORS_KEY) || JSON.stringify(UPDATED_COLORS));
        let activeActionId = null;

        let courierName = localStorage.getItem(COURIER_NAME_KEY);
        if (!courierName || courierName.trim() === '') {
            courierName = prompt('المرجو إدخال اسمك (اللفرور):', 'اللفرور');
            if (courierName && courierName.trim()) {
                localStorage.setItem(COURIER_NAME_KEY, courierName.trim());
            } else {
                localStorage.setItem(COURIER_NAME_KEY, 'اللفرور');
            }
        }
        updateCourierHeaderName();
        renderCourierOrders();

        function updateCourierHeaderName() {
            const name = localStorage.getItem(COURIER_NAME_KEY) || 'اللفرور';
            document.getElementById('courierTitleName').textContent = `اللفرور: ${name}`;
        }

        function changeCourierNamePrompt() {
            const currentName = localStorage.getItem(COURIER_NAME_KEY) || 'اللفرور';
            const newName = prompt('تعديل اسم اللفرور:', currentName);
            if (newName && newName.trim() !== '') {
                localStorage.setItem(COURIER_NAME_KEY, newName.trim());
                updateCourierHeaderName();
                alert(`تم تحديث اسم اللفرور إلى: ${newName.trim()}`);
            }
        }

        function saveAll() {
            localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
            localStorage.setItem(COLORS_KEY, JSON.stringify(colors));
            syncCloud();
        }

        async function syncCloud() {
            try {
                await fetch(`https://ntfy.sh/${NTFY_TOPIC}`, {
                    method: 'POST',
                    body: JSON.stringify({ orders, colors })
                });
            } catch (e) {}
        }

        async function fetchCloudData() {
            try {
                const res = await fetch(`https://ntfy.sh/${NTFY_TOPIC}/json?poll=1&since=24h`);
                const text = await res.text();
                const lines = text.trim().split('\n').filter(Boolean);
                if (lines.length > 0) {
                    for (let i = lines.length - 1; i >= 0; i--) {
                        const msg = JSON.parse(lines[i]);
                        if (msg.event === 'message' && msg.message) {
                            const parsed = JSON.parse(msg.message);
                            if (parsed && parsed.orders) {
                                orders = parsed.orders;
                                colors = parsed.colors || colors;
                                localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
                                localStorage.setItem(COLORS_KEY, JSON.stringify(colors));
                                if (!activeActionId) renderCourierOrders();
                                break;
                            }
                        }
                    }
                }
            } catch (e) {}
        }

        function startLiveStream() {
            const eventSource = new EventSource(`https://ntfy.sh/${NTFY_TOPIC}/sse`);
            eventSource.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.event === 'message' && data.message) {
                        const parsed = JSON.parse(data.message);
                        if (parsed && parsed.orders) {
                            orders = parsed.orders;
                            colors = parsed.colors || colors;
                            localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
                            localStorage.setItem(COLORS_KEY, JSON.stringify(colors));
                            if (!activeActionId) renderCourierOrders();
                        }
                    }
                } catch (e) {}
            };
        }

        async function markDelivered(id) {
            const idx = orders.findIndex(o => o.id === id);
            if (idx === -1) return;

            const order = orders[idx];
            order.status = 'delivered';
            order.deliveredAt = Date.now();

            const prod = colors.find(c => c.id === order.productId);
            if (prod) {
                prod.stock = Math.max(0, prod.stock - 1);
            }

            activeActionId = null;
            saveAll();
            renderCourierOrders();

            const sellerWhatsAppNumber = '212660005716';
            const waMsg = `✅ تم استلام الطلب بنجاح \n📍 العنوان: ${order.address} \n💰 الثمن: ${order.price} د.م`;
            const waUrl = `https://wa.me/${sellerWhatsAppNumber}?text=${encodeURIComponent(waMsg)}`;
            window.open(waUrl, '_blank');
        }

        function getClientWhatsAppUrl(phone, productName, price, address) {
            let clean = phone.replace(/[^0-9+]/g, '');
            if (clean.startsWith('06') || clean.startsWith('07')) {
                clean = '212' + clean.substring(1);
            } else if (clean.startsWith('+')) {
                clean = clean.substring(1);
            }
            const courierName = localStorage.getItem(COURIER_NAME_KEY) || 'اللفرور';
            const msg = `👋 السلام عليكم 👋\n 
 🛵 معكم : *${courierName}* اللفرور \n
📦 كنتواصل معكم بخصوص الطلب ديالكم: *${productName}* \n
💵 المبلغ المستحق : *${price}* درهم \n
📌 المرجو تأكيد عنوانكم : *${address}*`;
            return `https://wa.me/${clean}?text=${encodeURIComponent(msg)}`;
        }

        function showRefusalBox(id) {
            activeActionId = id;
            document.getElementById('refusal-box-' + id).classList.remove('hidden');
        }

        function showScheduleBox(id) {
            activeActionId = id;
            document.getElementById('schedule-box-' + id).classList.remove('hidden');
        }

        function cancelActionBox(id) {
            activeActionId = null;
            document.getElementById('refusal-box-' + id).classList.add('hidden');
            document.getElementById('schedule-box-' + id).classList.add('hidden');
        }

        async function confirmRefusal(id) {
            const reason = document.getElementById('reason-input-' + id).value.trim();
            if(!reason) return alert('أدخل السبب');
            const idx = orders.findIndex(o => o.id === id);
            orders[idx].status = 'refused';
            orders[idx].refusalReason = reason;
            activeActionId = null;
            saveAll();
            renderCourierOrders();
        }

        async function confirmSchedule(id) {
            const d = document.getElementById('sched-date-' + id).value;
            const t = document.getElementById('sched-time-' + id).value;
            const idx = orders.findIndex(o => o.id === id);
            orders[idx].status = 'scheduled';
            orders[idx].scheduledDate = d;
            orders[idx].scheduledTime = t;
            activeActionId = null;
            saveAll();
            renderCourierOrders();
        }

        function renderCourierOrders() {
            const pendingOrders = orders.filter(o => o.status === 'pending');
            document.getElementById('pendingBadge').textContent = `${pendingOrders.length} قيد الانتظار`;
            const container = document.getElementById('courierOrdersList');

            if (pendingOrders.length === 0) {
                container.innerHTML = `<div class="bg-slate-800 p-10 text-center rounded-2xl text-slate-400">لا توجد طلبات قيد الانتظار</div>`;
                return;
            }

            container.innerHTML = pendingOrders.map(order => `
                <div class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-lg text-white">
                    <div class="flex justify-between mb-2">
                        <span class="text-xs text-amber-400 font-bold">📦 ${order.productName || 'مظلة'}</span>
                        <span class="font-extrabold text-indigo-300">${order.price} د.م</span>
                    </div>
                    <p class="text-sm mb-4">📍 ${order.address}</p>
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <a href="tel:${order.phone}" class="bg-blue-600 text-center py-2.5 rounded-xl font-bold text-xs">📞 ${order.phone}</a>
                        <a href="${getClientWhatsAppUrl(order.phone, order.productName, order.price, order.address)}" target="_blank" class="bg-emerald-600 text-center py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5">
                            <i class="fa-brands fa-whatsapp text-sm"></i> واتساب المستلم
                        </a>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="markDelivered('${order.id}')" class="bg-emerald-600 py-2.5 rounded-xl font-bold text-xs">✅ تم الإستلام</button>
                        <button onclick="showRefusalBox('${order.id}')" class="bg-rose-600 py-2.5 rounded-xl font-bold text-xs">❌ رفض</button>
                        <button onclick="showScheduleBox('${order.id}')" class="bg-sky-600 py-2.5 rounded-xl font-bold text-xs">📅 جدولة</button>
                    </div>
                    <div id="refusal-box-${order.id}" class="hidden mt-3 pt-3 border-t border-slate-700">
                        <input type="text" id="reason-input-${order.id}" placeholder="سبب الرفض..." class="w-full px-3 py-2 bg-slate-900 border rounded-xl text-xs mb-2">
                        <div class="flex gap-2">
                            <button onclick="confirmRefusal('${order.id}')" class="flex-1 bg-rose-600 py-1.5 rounded-xl text-xs font-bold">تأكيد الرفض</button>
                            <button onclick="cancelActionBox('${order.id}')" class="px-3 bg-slate-700 rounded-xl text-xs">إلغاء</button>
                        </div>
                    </div>
                    <div id="schedule-box-${order.id}" class="hidden mt-3 pt-3 border-t border-slate-700 text-xs">
                        <div class="grid grid-cols-2 gap-2 mb-2">
                            <input type="date" id="sched-date-${order.id}" class="bg-slate-900 p-2 rounded-xl border">
                            <input type="time" id="sched-time-${order.id}" class="bg-slate-900 p-2 rounded-xl border">
                        </div>
                        <div class="flex gap-2">
                            <button onclick="confirmSchedule('${order.id}')" class="flex-1 bg-sky-600 py-1.5 rounded-xl font-bold">تأكيد الجدولة</button>
                            <button onclick="cancelActionBox('${order.id}')" class="px-3 bg-slate-700 rounded-xl">إلغاء</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.addEventListener('storage', () => {
            orders = JSON.parse(localStorage.getItem(ORDERS_KEY) || '[]');
            colors = JSON.parse(localStorage.getItem(COLORS_KEY) || JSON.stringify(UPDATED_COLORS));
            if (!activeActionId) renderCourierOrders();
        });

        fetchCloudData();
        startLiveStream();
    </script>
</body>
</html>
