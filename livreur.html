<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة اللفرور الاحترافية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .transition-smooth { transition: all 0.25s ease-in-out; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <header class="bg-slate-800/90 backdrop-blur-md border-b border-slate-700/80 sticky top-0 z-50 shadow-md">
        <div class="max-w-lg mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="changeCourierNamePrompt()" class="bg-emerald-500/20 text-emerald-400 p-2.5 rounded-2xl text-xl hover:bg-emerald-500/30 active-scale transition-smooth" title="تغيير اسم اللفرور">
                    🛵
                </button>
                <div>
                    <h1 class="text-base font-extrabold text-white" id="courierTitleName">صفحة اللفرور</h1>
                    <p class="text-[11px] text-emerald-400 font-bold flex items-center gap-1 mt-0.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span> متصل بالسيرفر لحظياً
                    </p>
                </div>
            </div>
            <span class="bg-amber-400 text-slate-950 font-extrabold text-xs px-3.5 py-1.5 rounded-full shadow-xs" id="pendingBadge">0 قيد الانتظار</span>
        </div>
    </header>

    <main class="max-w-lg mx-auto px-4 mt-6">
        <div id="courierOrdersList" class="space-y-4"></div>
    </main>

    <script>
        const SUPABASE_URL = "https://odrqwpcwcdfftjxatkyx.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kcnF3cGN3Y2RmZnRqeGF0a3l4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNjA2MzAsImV4cCI6MjEwNzkzNjYzMH0.Fvjz335UThZ0OfnwpdKCoO2Zg_WQA8jinFJnGV4CrB0";

        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const DEFAULT_COLORS = [
            { id: 'black', name: 'مظلة باللون الأسود', stock: 117, price: 130 },
            { id: 'black_2', name: 'منيطة باللون الأسود', stock: 120, price: 120 },
            { id: 'white_2', name: 'منيطة باللون الأبيض', stock: 50, price: 120 },
            { id: 'blue', name: 'مظلة باللون الأزرق', stock: 97, price: 130 },
            { id: 'gray', name: 'مظلة باللون الرمادي', stock: 78, price: 130 },
            { id: 'pink', name: 'مظلة باللون الوردي', stock: 65, price: 130 },
            { id: 'green', name: 'مظلة باللون الزيتي', stock: 53, price: 130 }
        ];

        let orders = [];
        let colors = JSON.parse(JSON.stringify(DEFAULT_COLORS));
        let activeActionId = null;

        const COURIER_NAME_KEY = `COURIER_NAME_simo_tanger`;
        let courierName = localStorage.getItem(COURIER_NAME_KEY);
        if (!courierName || courierName.trim() === '') {
            courierName = prompt('المرجو إدخال اسمك (اللفرور):', 'اللفرور');
            localStorage.setItem(COURIER_NAME_KEY, courierName ? courierName.trim() : 'اللفرور');
        }
        updateCourierHeaderName();

        async function loadDataFromSupabase() {
            const { data } = await sb.from('app_state').select('payload').eq('id', 'simo_store_data').single();
            if (data && data.payload) {
                orders = data.payload.orders || [];
                colors = data.payload.colors || DEFAULT_COLORS;
                renderCourierOrders();
            }
        }

        async function saveAllToSupabase() {
            const payload = { orders, colors };
            await sb.from('app_state').upsert({ id: 'simo_store_data', payload });
        }

        sb.channel('public:app_state_courier')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'app_state', filter: 'id=eq.simo_store_data' }, payload => {
              if (payload.new && payload.new.payload) {
                  orders = payload.new.payload.orders || [];
                  colors = payload.new.payload.colors || DEFAULT_COLORS;
                  if (!activeActionId) renderCourierOrders();
              }
          })
          .subscribe();

        loadDataFromSupabase();

        function updateCourierHeaderName() {
            const name = localStorage.getItem(COURIER_NAME_KEY) || 'اللفرور';
            document.getElementById('courierTitleName').textContent = `اللفرور: ${name}`;
        }

        function changeCourierNamePrompt() {
            const currentName = localStorage.getItem(COURIER_NAME_KEY) || 'اللفرور';
            const newName = prompt('تعديل اسم اللفرور:', currentName);
            if (newName && newName.trim() !== '') {
                localStorage.setItem(COURIER_NAME_KEY, newName.trim());
                updateCourierHeaderName();
                alert(`تم تحديث اسمك إلى: ${newName.trim()}`);
            }
        }

        async function markDelivered(id) {
            const idx = orders.findIndex(o => o.id === id);
            if (idx === -1) return;

            const order = orders[idx];
            order.status = 'delivered';
            order.deliveredAt = Date.now();

            const prod = colors.find(c => c.id === order.productId);
            if (prod) {
                prod.stock = Math.max(0, prod.stock - 1);
            }

            activeActionId = null;
            await saveAllToSupabase();
            renderCourierOrders();

            const sellerWhatsAppNumber = '212660005716';
            const waMsg = `✅ تم استلام الطلب بنجاح \n📍 العنوان: ${order.address} \n💰 الثمن: ${order.price} د.م`;
            window.open(`https://wa.me/${sellerWhatsAppNumber}?text=${encodeURIComponent(waMsg)}`, '_blank');
        }

        function getClientWhatsAppUrl(phone, productName, price, address) {
            let clean = phone.replace(/[^0-9+]/g, '');
            if (clean.startsWith('06') || clean.startsWith('07')) {
                clean = '212' + clean.substring(1);
            } else if (clean.startsWith('+')) {
                clean = clean.substring(1);
            }
            const courierName = localStorage.getItem(COURIER_NAME_KEY) || 'اللفرور';
            const msg = `السلام عليكم \nمعكم ${courierName} \nكنتواصلو معكم بخصوص طلبكم ${productName} \nالمبلغ المستحق ${price} د.م \nالمرجو تأكيد عنوانكم ${address}`;
            return `https://wa.me/${clean}?text=${encodeURIComponent(msg)}`;
        }

        function showRefusalBox(id) {
            activeActionId = id;
            document.getElementById('refusal-box-' + id).classList.remove('hidden');
        }

        function showScheduleBox(id) {
            activeActionId = id;
            document.getElementById('schedule-box-' + id).classList.remove('hidden');
        }

        function cancelActionBox(id) {
            activeActionId = null;
            document.getElementById('refusal-box-' + id).classList.add('hidden');
            document.getElementById('schedule-box-' + id).classList.add('hidden');
        }

        async function confirmRefusal(id) {
            const reason = document.getElementById('reason-input-' + id).value.trim();
            if(!reason) return alert('أدخل السبب');
            const idx = orders.findIndex(o => o.id === id);
            orders[idx].status = 'refused';
            orders[idx].refusalReason = reason;
            activeActionId = null;
            await saveAllToSupabase();
            renderCourierOrders();
        }

        async function confirmSchedule(id) {
            const d = document.getElementById('sched-date-' + id).value;
            const t = document.getElementById('sched-time-' + id).value;
            const idx = orders.findIndex(o => o.id === id);
            orders[idx].status = 'scheduled';
            orders[idx].scheduledDate = d;
            orders[idx].scheduledTime = t;
            activeActionId = null;
            await saveAllToSupabase();
            renderCourierOrders();
        }

        function renderCourierOrders() {
            const pendingOrders = orders.filter(o => o.status === 'pending');
            document.getElementById('pendingBadge').textContent = `${pendingOrders.length} قيد الانتظار`;
            const container = document.getElementById('courierOrdersList');

            if (pendingOrders.length === 0) {
                container.innerHTML = `<div class="bg-slate-800/80 border border-slate-700 p-12 text-center rounded-3xl text-slate-400 text-xs">لا توجد طلبات قيد الانتظار حالياً</div>`;
                return;
            }

            container.innerHTML = pendingOrders.map(order => `
                <div class="bg-slate-800/90 border border-slate-700/80 rounded-3xl p-5 shadow-xl text-white backdrop-blur-xs">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs bg-amber-500/20 text-amber-300 font-bold px-3 py-1 rounded-xl">📦 ${order.productName || 'مظلة'}</span>
                        <span class="font-extrabold text-emerald-400 text-sm bg-emerald-500/10 px-3 py-1 rounded-xl">${order.price} د.م</span>
                    </div>
                    <p class="text-sm mb-4 font-semibold text-slate-200">📍 ${order.address}</p>
                    <div class="grid grid-cols-2 gap-2.5 mb-3">
                        <a href="tel:${order.phone}" class="bg-blue-600 hover:bg-blue-700 text-center py-2.5 rounded-xl font-bold text-xs transition-smooth shadow-sm">📞 ${order.phone}</a>
                        <a href="${getClientWhatsAppUrl(order.phone, order.productName, order.price, order.address)}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-center py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 transition-smooth shadow-sm">
                            <i class="fa-brands fa-whatsapp text-sm"></i> واتساب المستلم
                        </a>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="markDelivered('${order.id}')" class="bg-emerald-600 hover:bg-emerald-700 py-2.5 rounded-xl font-bold text-xs transition-smooth shadow-sm">✅ تم الإستلام</button>
                        <button onclick="showRefusalBox('${order.id}')" class="bg-rose-600 hover:bg-rose-700 py-2.5 rounded-xl font-bold text-xs transition-smooth shadow-sm">❌ رفض</button>
                        <button onclick="showScheduleBox('${order.id}')" class="bg-sky-600 hover:bg-sky-700 py-2.5 rounded-xl font-bold text-xs transition-smooth shadow-sm">📅 جدولة</button>
                    </div>
                    <div id="refusal-box-${order.id}" class="hidden mt-3 pt-3 border-t border-slate-700">
                        <input type="text" id="reason-input-${order.id}" placeholder="سبب الرفض..." class="w-full px-3 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs mb-2.5 text-white">
                        <div class="flex gap-2">
                            <button onclick="confirmRefusal('${order.id}')" class="flex-1 bg-rose-600 hover:bg-rose-700 py-2 rounded-xl text-xs font-bold transition-smooth">تأكيد الرفض</button>
                            <button onclick="cancelActionBox('${order.id}')" class="px-4 bg-slate-700 hover:bg-slate-600 rounded-xl text-xs transition-smooth">إلغاء</button>
                        </div>
                    </div>
                    <div id="schedule-box-${order.id}" class="hidden mt-3 pt-3 border-t border-slate-700 text-xs">
                        <div class="grid grid-cols-2 gap-2 mb-2.5">
                            <input type="date" id="sched-date-${order.id}" class="bg-slate-900 p-2.5 rounded-xl border border-slate-700 text-white">
                            <input type="time" id="sched-time-${order.id}" class="bg-slate-900 p-2.5 rounded-xl border border-slate-700 text-white">
                        </div>
                        <div class="flex gap-2">
                            <button onclick="confirmSchedule('${order.id}')" class="flex-1 bg-sky-600 hover:bg-sky-700 py-2 rounded-xl font-bold transition-smooth">تأكيد الجدولة</button>
                            <button onclick="cancelActionBox('${order.id}')" class="px-4 bg-slate-700 hover:bg-slate-600 rounded-xl transition-smooth">إلغاء</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
