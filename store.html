<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMO CHOP - المتجر الرسمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f1f5f9; min-height: 100vh; }
        .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        .transition-smooth { transition: all 0.25s ease-in-out; }
    </style>
</head>
<body class="min-h-screen pb-24 text-slate-100">

    <!-- شريط العنوان العلوي للمتجر -->
    <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white w-10 h-10 rounded-2xl flex items-center justify-center shadow-md text-base font-black">
                    SC
                </div>
                <div>
                    <h1 class="text-sm font-black tracking-wide text-white">SIMO CHOP STORE</h1>
                    <p class="text-[10px] text-emerald-400 font-bold">تسوق أفضل المنتجات بضغطة زر</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="bg-indigo-500/20 text-indigo-300 font-bold text-xs px-3 py-1.5 rounded-xl border border-indigo-500/30">
                    🛍️ الدفع عند الاستلام
                </span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-8 space-y-8">
        
        <!-- قسم الترحيب وعرض المنتجات -->
        <section>
            <div class="text-center mb-8 space-y-2">
                <h2 class="text-2xl font-black text-white">منتجاتنا المميزة</h2>
                <p class="text-xs text-slate-400">اختر منتجك المفضل، املأ بياناتك وسنتكلف بباقي الإجراءات</p>
            </div>

            <!-- شبكة عرض المنتجات -->
            <div id="storeProductsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- يتم تعبئة المنتجات تلقائياً برمجياً -->
            </div>
        </section>

    </main>

    <!-- نافذة منبثقة (Modal) لإتمام الطلب عند اختيار منتج -->
    <div id="checkoutModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card w-full max-w-md rounded-3xl p-6 shadow-2xl space-y-5 text-right">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 class="text-sm font-extrabold text-white" id="modalProductTitle">إتمام طلب الشراء</h3>
                <button onclick="closeCheckoutModal()" class="text-slate-400 hover:text-white text-lg">&times;</button>
            </div>

            <form id="directOrderForm" class="space-y-4 text-xs">
                <input type="hidden" id="modalProductId">
                
                <div>
                    <label class="block font-bold text-slate-300 mb-1">المنتج المختار</label>
                    <input type="text" id="modalProductNameDisplay" readonly class="w-full px-3.5 py-3 rounded-xl border border-slate-700 bg-slate-950 text-indigo-300 font-bold">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold text-slate-300 mb-1">العدد (الكمية) *</label>
                        <input type="number" id="modalQty" min="1" value="1" required class="w-full px-3.5 py-3 rounded-xl border border-slate-700 bg-slate-900 text-white font-bold focus:outline-none">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-300 mb-1">الثمن الإجمالي</label>
                        <input type="text" id="modalTotalPriceDisplay" readonly class="w-full px-3.5 py-3 rounded-xl border border-slate-700 bg-slate-950 text-emerald-400 font-black">
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-slate-300 mb-1">الاسم الكامل *</label>
                    <input type="text" id="modalClientName" required placeholder="اسمك الكريم..." class="w-full px-3.5 py-3 rounded-xl border border-slate-700 bg-slate-900 text-white">
                </div>

                <div>
                    <label class="block font-bold text-slate-300 mb-1">رقم الهاتف *</label>
                    <input type="tel" id="modalClientPhone" required placeholder="06XXXXXXXX" dir="ltr" class="w-full px-3.5 py-3 rounded-xl border border-slate-700 bg-slate-900 text-white text-right">
                </div>

                <div>
                    <label class="block font-bold text-slate-300 mb-1">العنوان الكامل *</label>
                    <textarea id="modalClientAddress" required rows="2" placeholder="المدينة، الحي، الشارع..." class="w-full px-3.5 py-2.5 border border-slate-700 rounded-xl bg-slate-900 text-white"></textarea>
                </div>

                <div class="flex gap-2.5 pt-2">
                    <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-extrabold text-xs shadow-md transition-smooth">تأكيد الطلب الآن</button>
                    <button type="button" onclick="closeCheckoutModal()" class="px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 py-3.5 rounded-xl font-bold text-xs">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <!-- نافذة نجاح الطلب -->
    <div id="successModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="glass-card w-full max-w-sm rounded-3xl p-8 text-center space-y-4">
            <div class="text-5xl text-emerald-400">🎉</div>
            <h3 class="text-base font-black text-white">تم استلام طلبك بنجاح!</h3>
            <p class="text-xs text-slate-300">شكراً لتسوقك معنا. سنتصل بك قريباً لتأكيد عملية الشحن والتوصيل.</p>
            <button onclick="closeSuccessModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold text-xs transition-smooth">موافق</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://odrqwpcwcdfftjxatkyx.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kcnF3cGN3Y2RmZnRqeGF0a3l4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNjA2MzAsImV4cCI6MjEwNzkzNjYzMH0.Fvjz335UThZ0OfnwpdKCoO2Zg_WQA8jinFJnGV4CrB0";

        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let productsList = [];
        let storeOrders = [];
        let storeCourierDebt = 0;
        let selectedProductForCheckout = null;

        async function fetchStoreData() {
            try {
                const { data } = await sb.from('app_state').select('payload').eq('id', 'simo_store_data').single();
                if (data && data.payload) {
                    productsList = data.payload.colors || [];
                    storeOrders = data.payload.orders || [];
                    storeCourierDebt = data.payload.courierDebt || 0;
                    renderProductsGrid();
                }
            } catch (e) {}
        }

        function renderProductsGrid() {
            const grid = document.getElementById('storeProductsGrid');
            if (!grid) return;

            if (productsList.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-xs">لا توجد منتجات متوفرة حالياً</div>`;
                return;
            }

            grid.innerHTML = productsList.map(item => `
                <div class="glass-card rounded-3xl overflow-hidden flex flex-col justify-between transition-smooth hover:border-slate-700">
                    <div>
                        <div class="h-48 overflow-hidden bg-slate-950 relative">
                            <img src="${item.img || 'https://images.unsplash.com/photo-1533738363-b7f9aef128ce?w=400'}" class="w-full h-full object-cover" alt="${item.name}">
                            <span class="absolute top-3 right-3 bg-slate-900/80 backdrop-blur-md text-emerald-400 font-bold text-[11px] px-3 py-1 rounded-xl border border-slate-700">
                                متوفر: ${item.stock} قطعة
                            </span>
                        </div>
                        <div class="p-5 space-y-2">
                            <h3 class="font-extrabold text-white text-base">${item.name}</h3>
                            <p class="text-emerald-400 font-black text-sm">${item.price} د.م</p>
                        </div>
                    </div>
                    <div class="p-5 pt-0">
                        <button onclick="openCheckoutModal('${item.id}')" ${item.stock <= 0 ? 'disabled' : ''} 
                            class="w-full ${item.stock <= 0 ? 'bg-slate-800 text-slate-500 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700 text-white'} font-extrabold py-3 rounded-2xl text-xs transition-smooth shadow-md flex items-center justify-center gap-2">
                            <i class="fa-solid fa-cart-shopping"></i> ${item.stock <= 0 ? 'نفذت الكمية' : 'اطلب الآن'}
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function openCheckoutModal(id) {
            selectedProductForCheckout = productsList.find(p => p.id === id);
            if (!selectedProductForCheckout) return;

            document.getElementById('modalProductId').value = selectedProductForCheckout.id;
            document.getElementById('modalProductNameDisplay').value = selectedProductForCheckout.name;
            document.getElementById('modalQty').value = 1;
            updateModalTotal();
            document.getElementById('checkoutModal').classList.remove('hidden');
        }

        function closeCheckoutModal() {
            document.getElementById('checkoutModal').classList.add('hidden');
            document.getElementById('directOrderForm').reset();
        }

        function updateModalTotal() {
            if (!selectedProductForCheckout) return;
            const qty = parseInt(document.getElementById('modalQty').value) || 1;
            const total = selectedProductForCheckout.price * qty;
            document.getElementById('modalTotalPriceDisplay').value = total + " د.م";
        }

        document.getElementById('modalQty').oninput = updateModalTotal;

        document.getElementById('directOrderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (!selectedProductForCheckout) return;

            const qty = parseInt(document.getElementById('modalQty').value) || 1;
            const name = document.getElementById('modalClientName').value.trim();
            const phone = document.getElementById('modalClientPhone').value.trim();
            const address = document.getElementById('modalClientAddress').value.trim();

            const newOrder = {
                id: 'ORD_' + Date.now(),
                productId: selectedProductForCheckout.id,
                productName: selectedProductForCheckout.name,
                quantity: qty,
                phone: phone,
                address: `${name} - ${address}`,
                price: selectedProductForCheckout.price * qty,
                deliveryFee: 20,
                status: 'pending',
                refusalReason: '',
                scheduledDate: '',
                scheduledTime: '',
                courierName: '',
                createdAt: Date.now()
            };

            storeOrders.unshift(newOrder);

            try {
                await sb.from('app_state').upsert({
                    id: 'simo_store_data',
                    payload: { orders: storeOrders, colors: productsList, courierDebt: storeCourierDebt }
                });

                closeCheckoutModal();
                document.getElementById('successModal').classList.remove('hidden');
            } catch (err) {
                alert('حدث خطأ أثناء إرسال الطلب، المرجو إعادة المحاولة.');
            }
        });

        function closeSuccessModal() {
            document.getElementById('successModal').classList.add('hidden');
            fetchStoreData();
        }

        fetchStoreData();
        setInterval(fetchStoreData, 4000);
    </script>
</body>
</html>
