<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simo Chop - المتجر الإلكتروني</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0b0f19; color: #f1f5f9; min-height: 100vh; }
        .glass-panel { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        .glass-header { background: rgba(11, 15, 25, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.08); }
        .transition-smooth { transition: all 0.25s ease-in-out; }
    </style>
</head>
<body class="min-h-screen pb-20 text-slate-100">

    <header class="glass-header sticky top-0 z-50 shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white w-10 h-10 rounded-2xl flex items-center justify-center shadow-md text-base font-black">
                    SC
                </div>
                <div>
                    <h1 class="text-sm font-black tracking-wide text-white">SIMO CHOP STORE</h1>
                    <p class="text-[10px] text-emerald-400 font-bold">متجر التوصيل السريع</p>
                </div>
            </div>
            <span class="bg-indigo-500/20 text-indigo-300 font-bold text-xs px-3 py-1.5 rounded-xl border border-indigo-500/30">
                🛒 اطلب الآن والدفع عند الاستلام
            </span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">
        
        <!-- قسم إرسال طلب شراء -->
        <div class="glass-panel p-6 rounded-3xl">
            <h2 class="text-base font-black text-white mb-4 flex items-center gap-2">
                <i class="fa-solid fa-bag-shopping text-indigo-400"></i> استمارة طلب المنتج
            </h2>

            <form id="storeOrderForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5">اختر المنتج المطلوب *</label>
                    <select id="storeProductSelect" required class="w-full px-4 py-3.5 rounded-xl border border-slate-700 text-xs font-bold bg-slate-900 text-white focus:ring-2 focus:ring-indigo-500 focus:outline-none"></select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">العدد (الكمية) *</label>
                        <input type="number" id="storeQty" required min="1" value="1"
                            class="w-full px-4 py-3 rounded-xl border border-slate-700 text-xs font-bold bg-slate-900 text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1.5">الثمن الإجمالي (د.م)</label>
                        <input type="text" id="storeTotalPrice" readonly
                            class="w-full px-4 py-3 rounded-xl border border-slate-700 text-xs font-bold bg-slate-950 text-emerald-400 font-black">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5">اسم الكامل *</label>
                    <input type="text" id="clientName" required placeholder="الاسم الكريم..."
                        class="w-full px-4 py-3.5 rounded-xl border border-slate-700 text-xs font-bold bg-slate-900 text-white focus:outline-none">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5">رقم الهاتف *</label>
                    <input type="tel" id="clientPhone" required placeholder="06XXXXXXXX" dir="ltr"
                        class="w-full px-4 py-3.5 rounded-xl border border-slate-700 text-xs font-bold bg-slate-900 text-white focus:outline-none text-right">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 mb-1.5">العنوان الكامل *</label>
                    <textarea id="clientAddress" required rows="2" placeholder="المدينة، الحي، الشارع، رقم المنزل..."
                        class="w-full px-4 py-3.5 rounded-xl border border-slate-700 text-xs bg-slate-900 text-white focus:outline-none"></textarea>
                </div>

                <button type="submit" id="storeSubmitBtn"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-4 rounded-xl shadow-lg transition-smooth active:scale-95 text-xs flex items-center justify-center gap-2">
                    <i class="fa-solid fa-check-circle text-base"></i> <span>تأكيد وإرسال الطلب</span>
                </button>
            </form>
        </div>

        <!-- رسالة نجاح الطلب (تظهر بعد إتمام الطلب) -->
        <div id="successMsgBox" class="glass-panel p-8 rounded-3xl text-center space-y-3 hidden bg-emerald-950/30 border-emerald-500/30">
            <div class="text-4xl text-emerald-400">🎉</div>
            <h3 class="text-base font-black text-white">تم إرسال طلبك بنجاح!</h3>
            <p class="text-xs text-slate-300">شكراً لثقتكم بـ SIMO CHOP. سنتواصل معكم قريباً لتأكيد التوصيل.</p>
            <button onclick="resetStoreForm()" class="mt-2 bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold px-5 py-2.5 rounded-xl transition-smooth">
                إرسال طلب آخر
            </button>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://odrqwpcwcdfftjxatkyx.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kcnF3cGN3Y2RmZnRqeGF0a3l4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNjA2MzAsImV4cCI6MjEwNzkzNjYzMH0.Fvjz335UThZ0OfnwpdKCoO2Zg_WQA8jinFJnGV4CrB0";

        const { createClient } = supabase;
        const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let storeColors = [];
        let storeOrders = [];
        let storeCourierDebt = 0;

        async function loadStoreData() {
            try {
                const { data } = await sb.from('app_state').select('payload').eq('id', 'simo_store_data').single();
                if (data && data.payload) {
                    storeColors = data.payload.colors || [];
                    storeOrders = data.payload.orders || [];
                    storeCourierDebt = data.payload.courierDebt || 0;
                    populateStoreDropdown();
                }
            } catch (e) {}
        }

        function populateStoreDropdown() {
            const select = document.getElementById('storeProductSelect');
            if (!select) return;
            select.innerHTML = '';
            storeColors.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.dataset.price = c.price;
                opt.textContent = `${c.name} - ${c.price} د.م`;
                select.appendChild(opt);
            });
            updateStorePrice();
        }

        function updateStorePrice() {
            const select = document.getElementById('storeProductSelect');
            const qtyInput = document.getElementById('storeQty');
            const totalInput = document.getElementById('storeTotalPrice');
            if (!select || !qtyInput || !totalInput) return;

            const selectedOpt = select.options[select.selectedIndex];
            if (selectedOpt) {
                const unitPrice = parseFloat(selectedOpt.dataset.price) || 0;
                const qty = parseInt(qtyInput.value) || 1;
                totalInput.value = (unitPrice * qty) + " د.م";
            }
        }

        document.getElementById('storeProductSelect').onchange = updateStorePrice;
        document.getElementById('storeQty').oninput = updateStorePrice;

        document.getElementById('storeOrderForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const productId = document.getElementById('storeProductSelect').value;
            const product = storeColors.find(c => c.id === productId);
            const qty = parseInt(document.getElementById('storeQty').value) || 1;
            const unitPrice = product ? product.price : 0;

            const clientName = document.getElementById('clientName').value.trim();
            const clientPhone = document.getElementById('clientPhone').value.trim();
            const clientAddress = document.getElementById('clientAddress').value.trim();

            const newOrder = {
                id: 'ORD_' + Date.now(),
                productId: productId,
                productName: product ? product.name : 'منتج',
                quantity: qty,
                phone: clientPhone,
                address: `${clientName} - ${clientAddress}`, // دمج اسم الزبون مع العنوان ليسهل على اللفرور معرفته
                price: unitPrice * qty,
                deliveryFee: 20,
                status: 'pending',
                refusalReason: '',
                scheduledDate: '',
                scheduledTime: '',
                courierName: '',
                createdAt: Date.now()
            };

            storeOrders.unshift(newOrder);

            try {
                await sb.from('app_state').upsert({ 
                    id: 'simo_store_data', 
                    payload: { orders: storeOrders, colors: storeColors, courierDebt: storeCourierDebt } 
                });

                document.getElementById('storeOrderForm').classList.add('hidden');
                document.getElementById('successMsgBox').classList.remove('hidden');
            } catch (err) {
                alert('حدث خطأ أثناء إرسال الطلب، المرجو إعادة المحاولة.');
            }
        });

        function resetStoreForm() {
            document.getElementById('storeOrderForm').reset();
            document.getElementById('storeQty').value = '1';
            updateStorePrice();
            document.getElementById('successMsgBox').classList.add('hidden');
            document.getElementById('storeOrderForm').classList.remove('hidden');
            loadStoreData();
        }

        loadStoreData();
        setInterval(loadStoreData, 3000);
    </script>
</body>
</html>
